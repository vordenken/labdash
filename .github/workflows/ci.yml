name: CI

on:
  push:
    branches: [main, 'feature/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "ERROR: run gofmt -w on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -n 1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: node --test tests/*.test.mjs

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check semver.txt and compose.yaml agree
        run: |
          set -euo pipefail
          version="$(head -n 1 semver.txt)"
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "ERROR: semver.txt must start with an X.Y.Z version, got '$version'" >&2
            exit 1
          fi
          if [ "$(sed -n 2p semver.txt)" != "---" ]; then
            echo "ERROR: the second line of semver.txt must be ---" >&2
            exit 1
          fi
          if ! grep -Fq "image: ghcr.io/vordenken/labdash:${version}" compose.yaml; then
            echo "ERROR: compose.yaml must use ghcr.io/vordenken/labdash:${version}" >&2
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: labdash:ci
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name labdash-ci -p 127.0.0.1:8080:8080 \
            -e LABDASH_AUTH_PASSWORD=ci -e LABDASH_DOCKER_SOCKET=off labdash:ci
          # The scratch image has no shell, so poll /healthz from the runner.
          expected="\"version\":\"$(head -n 1 semver.txt)\""
          for _ in $(seq 1 20); do
            if body="$(curl -fsS http://127.0.0.1:8080/healthz)"; then
              echo "$body"
              if [[ "$body" != *"$expected"* ]]; then
                echo "ERROR: /healthz did not report $expected" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: labdash did not become healthy" >&2
          docker logs labdash-ci >&2
          exit 1

  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs: [test, release-metadata, docker]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
