name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish image and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: build-and-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether to release
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/release.sh check
      - name: Prepare release metadata
        id: release
        if: steps.check.outputs.should-build == 'true'
        env:
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash scripts/release.sh prepare
      - name: Check release is safe to publish
        id: existing
        if: steps.check.outputs.should-build == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const { newerStableTag } = require(`${process.env.GITHUB_WORKSPACE}/scripts/release-policy.cjs`);
            const tag = process.env.TAG;
            if (process.env.PRERELEASE === 'false') {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: 'semver.txt', ref: 'main'
              });
              const current = Buffer.from(data.content, 'base64').toString('utf8').split('\n')[0].trim();
              if (current !== process.env.VERSION) {
                core.setFailed(`main now has version ${current}; refusing to publish older ${tag}`);
                return;
              }
              const tags = execFileSync('git', ['tag', '--list', 'v*'], { encoding: 'utf8' }).split('\n');
              const newer = newerStableTag(process.env.VERSION, tags);
              if (newer) {
                core.setFailed(`${newer} is newer than ${tag}; refusing to roll back latest`);
                return;
              }
            }
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (data.draft) {
                core.setFailed(`Release ${tag} is a draft; resolve it before retrying`);
                return;
              }
              core.info(`Release ${tag} already exists; nothing will be overwritten.`);
              core.setOutput('published', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('published', 'false');
            }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.existing.outputs.published == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.published == 'false'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.existing.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.existing.outputs.published == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.image-version }}
            type=raw,value=${{ steps.release.outputs.major-minor }},enable=${{ steps.release.outputs.prerelease == 'false' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.published == 'false'
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          build-args: VERSION=${{ steps.release.outputs.image-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create GitHub release and tag
        if: steps.existing.outputs.published == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ steps.release.outputs.tag }}
          IMAGE_VERSION: ${{ steps.release.outputs.image-version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        with:
          script: |
            const fs = require('node:fs');
            const lines = fs.readFileSync('semver.txt', 'utf8').split('\n').slice(2);
            const end = lines.findIndex((line) => /^## \d+\.\d+\.\d+/.test(line));
            const notes = (end === -1 ? lines : lines.slice(0, end)).join('\n').trim();
            if (!notes) throw new Error('semver.txt must contain release notes after ---');
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}:${process.env.IMAGE_VERSION}`;
            const warning = process.env.PRERELEASE === 'true'
              ? '> [!WARNING]\n> **This is a beta release.** It may be unstable or incomplete.\n\n' : '';
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              name: process.env.TAG,
              prerelease: process.env.PRERELEASE === 'true',
              body: `${warning}${notes}\n\n**Image:** \`${image}\``,
            });
