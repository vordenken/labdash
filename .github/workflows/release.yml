name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches semver.txt
        id: version
        run: |
          set -euo pipefail
          version="$(head -n 1 semver.txt)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match semver.txt version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            // semver.txt: line 1 = version, line 2 = "---", then the notes for
            // this version until the first "## X.Y.Z" heading of older notes.
            const lines = fs.readFileSync('semver.txt', 'utf8').split('\n').slice(2);
            const end = lines.findIndex((line) => /^## \d+\.\d+\.\d+/.test(line));
            const notes = (end === -1 ? lines : lines.slice(0, end)).join('\n').trim();
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}:${process.env.VERSION}`;
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `v${process.env.VERSION}`,
              body: `${notes}\n\n**Image:** \`${image}\``,
            });
